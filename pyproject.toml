[project]
name = "custom_ledger"
authors = [
    { name = "Custom Ledger Contributors" }
]
description = "Configurable custom ledgers for Frappe — define your own ledgers driven by field changes on any DocType."
requires-python = ">=3.10,<3.15"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "custom_ledger"

# Frappe Cloud marketplace reads this to match the app to a compatible Frappe
# version at publish/deploy time. This is the Frappe v16 release line.
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

# These dependencies are only required for development and CI;
# they are not installed on Frappe Cloud production benches.
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

# Frappe Cloud honours this block — declare APT packages here if ever needed.
# [deploy.dependencies.apt]
# packages = []
