name: CI

# Runs on every push and pull request. Two independent jobs:
#   * semgrep — Frappe's security/correctness rules (the marketplace gate).
#   * tests   — the app's unit tests on a real Frappe bench.
#
# FRAPPE_BRANCH and PYTHON_VERSION are what differ per app branch. Frappe pins an
# exact Python per major, so the CI Python MUST match the Frappe branch:
#   main / version-16  -> FRAPPE_BRANCH version-16, PYTHON_VERSION 3.14 (Frappe v16 requires 3.14)
#   version-15         -> FRAPPE_BRANCH version-15, PYTHON_VERSION 3.11 (Frappe v15 allows 3.10-3.14)
# Keep both in sync with pyproject.toml's requires-python when porting.

on:
  push:
    branches: [main, version-15, version-16]
  pull_request:

env:
  FRAPPE_BRANCH: version-16
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

jobs:
  semgrep:
    name: Semgrep (Frappe rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install semgrep
        run: pip install semgrep
      - name: Clone Frappe semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules
      - name: Run semgrep
        run: semgrep --config ./frappe-semgrep-rules/rules custom_ledger --error

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --password=root"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: apps/custom_ledger

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmysqlclient-dev
          npm install -g yarn
          pip install frappe-bench

      - name: Init bench and install the app into it
        run: |
          bench init --skip-redis-config-generation --skip-assets --frappe-branch "$FRAPPE_BRANCH" ~/frappe-bench
          # Copy the checked-out app in, then register it as an editable package
          # and in apps.txt so `bench install-app` can import it. A plain copy
          # leaves the module un-importable (ModuleNotFoundError: custom_ledger).
          cp -r "$GITHUB_WORKSPACE/apps/custom_ledger" ~/frappe-bench/apps/custom_ledger
          cd ~/frappe-bench
          ./env/bin/pip install --quiet -e apps/custom_ledger
          # Leading newline: bench's apps.txt "frappe" line has no trailing \n,
          # so a bare echo would produce "frappecustom_ledger" on one line.
          printf '\ncustom_ledger\n' >> sites/apps.txt

      - name: Create site and install app
        working-directory: /home/runner/frappe-bench
        run: |
          bench set-config -g root_password root
          bench set-mariadb-host 127.0.0.1
          # Point the bench at the CI Redis service (init used
          # --skip-redis-config-generation, so these are otherwise unset).
          bench set-config -g redis_cache "redis://localhost:6379"
          bench set-config -g redis_queue "redis://localhost:6379"
          bench set-config -g redis_socketio "redis://localhost:6379"
          bench new-site test_site \
            --mariadb-root-password root \
            --admin-password admin \
            --no-mariadb-socket
          bench --site test_site set-config developer_mode 1
          bench --site test_site set-config allow_tests true
          # install-app runs the app's migrations, so no separate `bench migrate`.
          bench --site test_site install-app custom_ledger

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app custom_ledger
